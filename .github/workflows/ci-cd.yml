name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy the current commit or roll back to the previous release"
        type: choice
        options: [deploy, rollback]
        default: deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Replay saved example runs with the organizers' tool
        run: |
          for f in examples/runs/*.result.json; do
            python model/operations.py --result "$f" --output "/tmp/$(basename "$f")" > /dev/null
          done

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "orbit-planner:${GITHUB_SHA::12}" .
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 "orbit-planner:${GITHUB_SHA::12}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/meta > /dev/null
          curl -fsS http://127.0.0.1:8000/ | grep -q "<div id=\"root\">"
          docker rm -f smoke
      - name: Save image for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "orbit-planner:${GITHUB_SHA::12}" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "Secret DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Variable DEPLOY_KNOWN_HOSTS is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy@${{ vars.DEPLOY_HOST }}" >> "$GITHUB_ENV"
      - name: Roll back
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        run: $SSH rollback
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push' || inputs.action == 'deploy'
        with:
          name: image
      - name: Upload image and release files
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: |
          $SSH load < image.tar.gz
          $SSH put compose < deploy/compose.yml
          $SSH put deploy < deploy/deploy.sh
      - name: Switch release (health check, automatic rollback)
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: $SSH deploy "${GITHUB_SHA::12}"
      - name: Check from outside
        run: curl -fsS --retry 5 --retry-delay 3 "http://${{ vars.DEPLOY_HOST }}/api/health"
